# Netlify Configuration for CleanSight Frontend
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # VITE_* values are bundled into client-side JS by design. The Firebase web API key
  # and the backend API base URL are public identifiers, not secrets (access is
  # controlled by Firebase Security Rules / authorized domains).
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_API_BASE"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
